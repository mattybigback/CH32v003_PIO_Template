; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[base]
platform = ch32v
framework = ch32v003fun
lib_deps =
    https://github.com/mattybigback/CH32V003_lib_i2c
build_flags =
    -D CH32V003
    -D FUNCONF_SYSTICK_USE_HCLK=1

[env:genericCH32V003A4M6]
extends = base
board = genericCH32V003A4M6


[env:genericCH32V003F4P6]
extends = base
board = genericCH32V003F4P6

[env:genericCH32V003F4P6_ext_xtal]
extends = base
board = genericCH32V003F4P6
build_flags =
    -DFUNCONF_USE_HSE=1
    -DFUNCONF_USE_PLL=1
    -DFUNCONF_SYSTEM_CORE_CLOCK=48000000


[env:genericCH32V003J4M6]
extends = base
board = genericCH32V003J4M6
